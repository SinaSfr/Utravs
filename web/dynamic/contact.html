<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover">
    <!-- Title & Description -->
    <title>[##cms.seo.title|(Utravs - Tour service reservation)##]
    </title>
    <meta name="description"
        content="[##cms.seo.description|(utravs / Online tour service booking.)##]">
    <!-- Title & Description -->
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <!-- pwa metatags -->
    <basis core="call" file="pwa.inc" lid="2" />
    <!-- common styles for all page -->
    <basis core="call" file="style.inc" lid="2" />
</head>

<body>
    <basis core="call" file="header.inc" lid="2" />
    <main>
        <section class="relative flex items-end bg-contactBg bg-center bg-cover h-[350px]">
            <div class="absolute inset-0 bg-custom-gradient w-full h-full"></div>
            <div
                class="relative z-10 flex items-center justify-center gap-20 mx-auto w-full max-lg:w-[90%] max-xl:w-[97%] xl:max-w-7xl bg-black/50 py-2 rounded-t-2xl">
                <span class="w-2 h-2 bg-white rounded-full"></span>
                <h1 class="text-white text-3xl">Contact Us</h1>
                <span class="w-2 h-2 bg-white rounded-full"></span>
            </div>
        </section>
        <div class="bg-zinc-200 py-16">

            <basis core="print" datamembername="db.info">
                <layout>
                    <section class="mx-auto w-full max-lg:w-[90%] max-xl:w-[97%] xl:max-w-7xl">
                        <div>
                            <h2
                                class="inline-block text-primary-600 text-2xl border-b-2 border-primary-600 border-solid">
                                About
                                us</h2>
                            @child
                        </div>
                    </section>
                </layout>
                <face filter="TypeID in(144)">
                    <div class="text-justify mt-6">
                        @largetext
                    </div>
                </face>
            </basis>


            <div
                class="flex gap-20 bg-white py-8 px-6 rounded-xl mx-auto w-full max-lg:w-[90%] max-xl:w-[97%] xl:max-w-7xl mt-10">
                <section class="flex-1">
                    <h2 class="inline-block text-2xl text-primary-600 border-b-2 border-primary-600 border-solid mb-5">
                        Contact Form</h2>
                    <div class="flex flex-col about-form" id="about-form">

                        <basis core="schema" run="atclient"
                            schemaurl="/schema/domainform/FCD67E12-50C5-4363-847A-BC9623C31E76/45F40D49-07E7-4CDF-89F7-CF33B7A936D6/en/contact-us"
                            displaymode="new" button="[data-btn-uploadAbout]" resultsourceid="upload.dataAbout"
                            OnRendered="RenderFormAbout"></basis>
                        <basis core="api" if="{##cms.uploadAbout.run|(false)##}" run="atclient"
                            url="/schema/domainform/FCD67E12-50C5-4363-847A-BC9623C31E76/en/editobject" method="post"
                            body="object_edit={##cms.uploadAbout.value##}&captcha={##cms.uploadAbout.captcha##}&captchaid={##cms.uploadAbout.captchaid##}"
                            content-type="application/x-www-form-urlencoded" triggers='cms.uploadAbout'
                            OnProcessed="OnProcessedEditObjectAbout"></basis>
                        <basis core="callback" run="atclient" method="uploadDocumentAbout" triggers="upload.dataAbout">
                        </basis>

                        <div class="captcha-button flex flex-col items-center justify-center mt-1">
                            <div id="captchaContainer" class="captchaContainerclass captcha-sefaresh w-auto"
                                data-bc-answer-container data-bc-schema-info-multi="0" data-bc-schema-info-word="58"
                                data-bc-schema-info-part="1" data-bc-schema-info-part-0-type="text">
                                <basis core="dbsource" source="trust_login" name="captcha-about" run="atclient"
                                    triggers="captcha.refreshAbout">
                                    <member name="code" type="scalar" request="captcha"></member>
                                </basis>
                                <basis datamembername="captcha-about.code" core="print" run="atclient">
                                    <face>
                                        <script type="text/template">
                                                <div class="d-inline-block">
                                                  <div class="flex justify-between gap-5">
                                                  <div class="float-right">
                                                    <input type="text" class="contactUsInput codeinputm" name="captcha" maxlength="4" placeholder="Security Code"/>
                                                    <input type="hidden" name="captchaid" value="@captcha@" />
                                                  </div>
                                                  <div class="flex items-center gap-4">
                                                      <img src="/@captcha@" loading="lazy" width="120" height="60" alt="captcha" class="w-16 h-auto" />
                                                      <svg class="inline-block align-middle cursor-pointer w-9 h-9" onclick="refreshCaptchaAbout()" width="24" height="24" viewBox="0 0 20 19" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18.1247 8.56165H18.1238C18.0007 8.56175 17.8788 8.5861 17.7651 8.63331C17.6514 8.68052 17.5481 8.74967 17.4611 8.8368C17.3741 8.92393 17.3052 9.02734 17.2581 9.14113C17.2111 9.25492 17.187 9.37685 17.1871 9.49997C17.1859 10.8143 16.8245 12.1032 16.1421 13.2265C15.4597 14.3498 14.4824 15.2646 13.3166 15.8714C12.1507 16.4782 10.8408 16.7538 9.52921 16.6683C8.21765 16.5827 6.95463 16.1393 5.87744 15.3862C2.63134 13.1132 1.83959 8.62309 4.11255 5.37696C6.38552 2.13083 10.8757 1.33899 14.1218 3.61204C14.6129 3.95501 15.0592 4.358 15.4504 4.81165H12.8121C12.5635 4.81165 12.325 4.91042 12.1492 5.08623C11.9734 5.26205 11.8746 5.5005 11.8746 5.74915C11.8746 5.99779 11.9734 6.23624 12.1492 6.41206C12.325 6.58787 12.5635 6.68665 12.8121 6.68665H17.1871C17.4358 6.68665 17.6742 6.58787 17.85 6.41206C18.0259 6.23624 18.1246 5.99779 18.1246 5.74915V1.37415C18.1246 1.12551 18.0259 0.887048 17.85 0.711233C17.6742 0.535418 17.4358 0.436646 17.1871 0.436646C16.9385 0.436646 16.7 0.535418 16.5242 0.711233C16.3484 0.887048 16.2496 1.12551 16.2496 1.37415V2.93536C15.9206 2.62321 15.5689 2.33596 15.1973 2.07598C14.2225 1.39342 13.1228 0.909542 11.9609 0.651979C10.7991 0.394417 9.59797 0.368213 8.42603 0.574863C7.25409 0.781513 6.13433 1.21697 5.13067 1.85637C4.12702 2.49578 3.25914 3.3266 2.57658 4.30141C1.19808 6.27013 0.658111 8.70582 1.07546 11.0727C1.49281 13.4395 2.83329 15.5436 4.80201 16.9221C6.31776 17.9898 8.12639 18.563 9.98041 18.5633C10.5144 18.5631 11.0474 18.5162 11.5732 18.4233C13.6714 18.0531 15.5722 16.9556 16.9417 15.3235C18.3112 13.6914 19.062 11.6289 19.0621 9.49833C19.0619 9.24983 18.963 9.01159 18.7873 8.83596C18.6115 8.66032 18.3732 8.56166 18.1247 8.56165Z" fill="#000"/></svg>
                                                  </div>
        
                                              </div></div></script>
                                    </face>
                                </basis>
                            </div>
                            <button
                                class="flex justify-center items-center gap-5 w-full h-12 text-white transition-all duration-300 data-body-btn mt-2 bg-secondary-600 rounded-xl hover:bg-primary-900"
                                type="button" data-btn-uploadAbout>
                                <span class="">Send</span>
                            </button>

                        </div>
                        <div
                            class="Loading_Form hidden data-body-btn w-[126px] h-12 px-4 py-2 bg-secondary-800 rounded-2xl justify-center items-center gap-2.5">
                            <div id="ballsWaveG" class="text-base font-normal leading-normal ext-zinc-50">
                                <div id="ballsWaveG_1" class="ballsWaveG"></div>
                                <div id="ballsWaveG_2" class="ballsWaveG"></div>
                                <div id="ballsWaveG_3" class="ballsWaveG"></div>
                                <div id="ballsWaveG_4" class="ballsWaveG"></div>
                                <div id="ballsWaveG_5" class="ballsWaveG"></div>
                                <div id="ballsWaveG_6" class="ballsWaveG"></div>
                                <div id="ballsWaveG_7" class="ballsWaveG"></div>
                                <div id="ballsWaveG_8" class="ballsWaveG"></div>
                            </div>
                        </div>
                        <div class="mt-4 text-center text-secondary-500 message-api"></div>
                    </div>
                </section>
                <section class="flex-1">
                    <h2 class="inline-block text-2xl text-primary-600 border-b-2 border-primary-600 border-solid mb-5">
                        Contact Information</h2>
                    <basis core="print" datamembername="db.info">
                        <layout>
                            <ul class="flex flex-col gap-6">
                                @child
                            </ul>
                        </layout>
                        <face filter="TypeID in(244)">
                            <li class="flex flex-col gap-2">
                                <h3 class="text-lg text-zinc-900">Address:</h3>
                                <div class="text-lg text-secondary-600">@largetext</div>
                            </li>
                        </face>
                        <face filter="valueID in(4177676)">
                            <li class="flex flex-col gap-2">
                                <h3 class="text-lg text-zinc-900">Phone support:</h3>
                                <a href="tel:@text"
                                    class="w-fit relative transition-all duration-300 hover:text-primary-900 group text-lg text-secondary-600">
                                    @text
                                    <span
                                        class="absolute left-0 w-0 h-px transition-all duration-300 -bottom-1 bg-primary-900 group-hover:w-full"></span>
                                </a>
                            </li>
                        </face>
                        <face filter="valueID in(4177682)">
                            <li class="flex flex-col gap-2">
                                <h3 class="text-lg text-zinc-900">Mobile support:</h3>
                                <a href="tel:@text"
                                    class="w-fit relative transition-all duration-300 hover:text-primary-900 group text-lg text-secondary-600">
                                    @text
                                    <span
                                        class="absolute left-0 w-0 h-px transition-all duration-300 -bottom-1 bg-primary-900 group-hover:w-full"></span>
                                </a>
                            </li>
                        </face>
                        <face filter="TypeID in(242)">
                            <li class="flex flex-col gap-2">
                                <h3 class="text-lg text-zinc-900">Email:</h3>
                                <a href="mailto:@text"
                                    class="w-fit relative transition-all duration-300 hover:text-primary-900 group text-lg text-secondary-600">
                                    @text
                                    <span
                                        class="absolute left-0 w-0 h-px transition-all duration-300 -bottom-1 bg-primary-900 group-hover:w-full"></span>
                                </a>
                            </li>
                        </face>
                    </basis>

                </section>
            </div>
            <basis core="print" datamembername="db.info">
                <layout>
                    <section class="mt-16">
                        @child
                    </section>
                </layout>
                <face filter="prpID=91462">
                    <iframe defer title="Tbibooking location" class="w-full h-96 object-cover" width="1920" height="600"
                        loading="lazy" target="_blank" allowfullscreen
                        src="https://maps.google.com/maps?q=@largetext,@text&z=14&output=embed"></iframe>
                </face>
            </basis>
        </div>

    </main>
    <basis core="call" file="footer.inc" lid="2" />
</body>

</html>
